default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # mypy corre en el entorno del proyecto, no en uno aislado de pre-commit.
  #
  # El hook oficial (mirrors-mypy) crea su propio venv y obliga a repetir ahí cada
  # dependencia en `additional_dependencies`. Esa lista se desincroniza de pyproject.toml a
  # la primera: bastó con que faltara structlog para que el commit fallara con
  # "Cannot find implementation or library stub". Con playwright y pywinauto por llegar
  # —y siendo pywinauto solo-Windows— la duplicación no compensa.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (entorno del proyecto)
        entry: uv run mypy
        language: system
        types: [python]
        # La configuración ya fija `files = ["src"]`; pasar nombres sueltos haría que
        # mypy analizara módulos fuera de contexto y diera falsos positivos.
        pass_filenames: false
