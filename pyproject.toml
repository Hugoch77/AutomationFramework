[project]
name = "automation-framework"
version = "0.1.0"
description = "Framework de automatización multi-engine (web y escritorio) sobre Python"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Hugoch77" }]

dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
]

[project.optional-dependencies]
web = ["playwright>=1.50"]
desktop = ["pywinauto>=0.6.9; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "mypy>=1.15",
    "pre-commit>=4.1",
]

# Registra el plugin de pytest al instalar el paquete: las suites no necesitan un
# conftest.py sólo para cablearlo.
[project.entry-points.pytest11]
automation_framework = "automation_framework.fixtures.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation_framework"]


# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# La raíz va en el path para que los Page Objects de una suite se importen por su ruta
# (`tests.e2e.web.saucedemo`). Viven junto a los tests que los usan, no en el paquete:
# el framework no debe saber que saucedemo existe.
pythonpath = ["src", "."]
# Los tests de escritorio requieren una sesión de Windows interactiva y desbloqueada,
# por eso quedan fuera por defecto. Pídelos explícitamente con: pytest -m desktop
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not desktop",
]
markers = [
    "unit: pruebas del framework, sin UI ni red",
    "arch: pruebas de reglas de arquitectura",
    "web: pruebas end-to-end sobre un SUT web",
    "desktop: pruebas end-to-end sobre una app de escritorio Windows (requiere sesión interactiva)",
    "smoke: subconjunto crítico, debe pasar siempre",
    "slow: tarda más de ~10s",
    "external: depende de un sitio de terceros; puede fallar por causas ajenas al código",
    "af_config(**ajustes): sobrescribe la configuración del engine para ese test",
]
log_cli_level = "INFO"
filterwarnings = ["error"]


# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
# En la documentación la alineación de los ejemplos es deliberada.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff-specific
    "ANN",       # type annotations
    "PT",        # pytest style
    "PTH",       # usar pathlib
]
ignore = [
    "ANN401",    # permitir Any donde sea deliberado
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]      # los tests no necesitan anotaciones completas

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"


# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pywinauto.*"]
ignore_missing_imports = true


# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/automation_framework"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    # Cuerpos que son sólo `...`. Anclado a propósito: sin los anclas, el patrón casaba con
    # cualquier línea que contuviera puntos suspensivos —por ejemplo la firma
    # `ignored_exceptions: tuple[type[Exception], ...]`— y, al pertenecer a una sentencia
    # `def`, coverage excluía la función ENTERA. Inflaba la cobertura en silencio.
    "^\\s*\\.\\.\\.$",
]
