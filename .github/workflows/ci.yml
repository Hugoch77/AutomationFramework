name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra web

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra web

      # `coverage run -m pytest`, no `pytest --cov`: el plugin de este paquete se registra
      # por entry point `pytest11`, así que pytest lo importa —y con él todo el paquete—
      # antes de que pytest-cov empiece a medir. El código a nivel de módulo se ejecutaría
      # sin instrumentar y la cobertura saldría falsamente baja.
      - name: Pytest (unit + arch)
        run: >
          uv run coverage run -m pytest tests/unit tests/arch
          --junitxml=reports/junit-unit.xml

      - name: Informe de cobertura
        run: |
          uv run coverage report --show-missing
          uv run coverage xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-unit
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Suite web (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra web

      # La versión del navegador va en la clave: al actualizar Playwright, la caché
      # antigua no se reutiliza y evitamos un navegador incompatible.
      - name: Caché de navegadores
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Instalar Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Dependencias del sistema
        if: steps.browsers.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      # Se excluye `external`: esos tests dependen de un sitio de terceros y tiene su
      # propio job, que no bloquea.
      - name: Pytest (web contra páginas locales)
        run: >
          uv run pytest -m "web and not external"
          --junitxml=reports/junit-web.xml

      - name: Publicar evidencia del fallo
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: evidencia-web
          path: |
            artifacts/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  external:
    name: Suite contra sitio público
    runs-on: ubuntu-latest
    # Informativo: si saucedemo.com está caído o cambia, no es culpa de este código y no
    # debe bloquear un merge. Lo que sí bloquea es el job `web`, que no depende de nadie.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra web

      - name: Instalar Chromium
        run: uv run playwright install --with-deps chromium

      - name: Pytest (external)
        run: >
          uv run pytest -m external
          --junitxml=reports/junit-external.xml

      # Este job no bloquea, así que la evidencia es la única forma de distinguir "el sitio
      # cambió el marcado" de "la red del runner iba mal" sin volver a ejecutarlo a ciegas.
      - name: Publicar evidencia del fallo
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: evidencia-external
          path: |
            artifacts/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  # La suite desktop vive en desktop.yml (self-hosted runner) y se activa en la Fase 6.
